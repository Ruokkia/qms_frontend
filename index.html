<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 垫片：sockjs-client 在浏览器中引用 Node 的 global，执行前先定义以免 ReferenceError -->
    <script>window.global = window;</script>
    <!-- 垫片：sockjs-client 注册 unload 事件触发 Chrome Permissions Policy 警告，将其重定向为 pagehide -->
    <script>
      (function () {
        var origAdd = EventTarget.prototype.addEventListener;
        var origRemove = EventTarget.prototype.removeEventListener;
        EventTarget.prototype.addEventListener = function (type, listener, options) {
          if (type === 'unload') type = 'pagehide';
          return origAdd.call(this, type, listener, options);
        };
        EventTarget.prototype.removeEventListener = function (type, listener, options) {
          if (type === 'unload') type = 'pagehide';
          return origRemove.call(this, type, listener, options);
        };
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232f81f7'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif'>Q</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>康立 QMS 质量管理系统</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
